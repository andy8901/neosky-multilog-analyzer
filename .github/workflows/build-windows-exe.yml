name: Build Windows .exe

on:
  push:
    branches: [main]
    paths:
      - "neosky_multilog_analyzer.py"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "build_exe.bat"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build .exe
        run: .\build_exe.bat

      - name: Verify build output
        run: |
          if (-not (Test-Path "dist\NeoskyMultilogAnalyzer.exe")) {
            Write-Error "dist\NeoskyMultilogAnalyzer.exe was not produced"
            exit 1
          }
          Get-Item "dist\NeoskyMultilogAnalyzer.exe" | Select-Object Name, Length

      # Smoke test: launch the packaged .exe and confirm it stays alive (no
      # immediate crash/traceback) for a few seconds, the same check you'd
      # do by eye on a desktop -- this runner has an interactive desktop
      # session so the Tk window actually renders.
      - name: Launch smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\NeoskyMultilogAnalyzer.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "App exited on its own within 8 seconds (exit code $($proc.ExitCode)) -- likely crashed on startup."
            exit 1
          }
          Write-Output "App is still running after 8 seconds (PID $($proc.Id)) -- no startup crash."
          Stop-Process -Id $proc.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NeoskyMultilogAnalyzer-windows-exe
          path: dist/NeoskyMultilogAnalyzer.exe
          retention-days: 30
